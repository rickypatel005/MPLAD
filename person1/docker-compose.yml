# SIH26102 — MPLADS Audit Intelligence
# Docker Compose: PostgreSQL 15 + PostGIS 3.3
# Phase 5: Relational Database Layer

version: "3.9"

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: mplads-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mplads_audit
      POSTGRES_USER: mplads_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sih26102_secure_pwd}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mplads_admin -d mplads_audit"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
